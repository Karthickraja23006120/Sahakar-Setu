# loadtest/docker-compose.scaling.yml
#
# Horizontal-scaling demo: 3 identical app containers behind an nginx load
# balancer, all sharing one data volume (a stand-in for a shared PostgreSQL
# instance in the real architecture - see README "Known prototype
# shortcuts"). This is what backs the "additional instances behind a load
# balancer serve requests independently" claim in loadtest/run.js.
#
# Usage (from the project root):
#   docker compose -f loadtest/docker-compose.scaling.yml up --build
#   # then hit http://localhost:8080 instead of :3000
#
# To reproduce the scaling proof against this instead of a single instance:
#   LOADTEST_URL=http://localhost:8080 node loadtest/run.js

version: "3.8"

services:
  app1:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - shared-data:/app/data
    environment:
      - JWT_SECRET=sahakar-setu-dev-secret-change-me

  app2:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - shared-data:/app/data
    environment:
      - JWT_SECRET=sahakar-setu-dev-secret-change-me

  app3:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - shared-data:/app/data
    environment:
      - JWT_SECRET=sahakar-setu-dev-secret-change-me

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  shared-data:
