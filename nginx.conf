# loadtest/nginx.conf
#
# Round-robin load balancer in front of N identical app instances.
# This is the piece that turns "one instance handles ~1.7-2k req/s" into
# "N instances behind a gateway handle ~N x that" - the horizontal-scaling
# half of the scalability proof (the other half is loadtest/run.js).
#
# Because every app instance is stateless (JWT auth, tenant filtering done
# per-request against the shared datastore, no in-memory session), nginx
# does not need sticky sessions - any instance can answer any request.

events {
  worker_connections 1024;
}

http {
  upstream sahakar_setu_app {
    # least_conn balances better than round-robin once request costs vary
    # (e.g. AI matching vs a simple list read) - matches the real mix of
    # endpoint costs measured in loadtest/run.js.
    least_conn;
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://sahakar_setu_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
